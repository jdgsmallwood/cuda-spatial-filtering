name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: sudo apt-get update && sudo apt-get install -y g++ libhiredis-dev nlohmann-json3-dev
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q -ra tests
        env:
          SPATIAL_REQUIRE_MONITOR_TESTS: "1"
  difx-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config libfftw3-dev
      - run: python -m pip install 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pytest>=8,<9'
      - name: Build pinned DiFX zerocorr
        run: |
          git clone --depth 1 --branch v2.9.0 https://github.com/difx/difx.git "$RUNNER_TEMP/difx"
          cd "$RUNNER_TEMP/difx"
          test "$(git rev-parse HEAD)" = 39401aa88b24d3084fe683f52d23975a7b5da3d4
          cd libraries/mark5access
          autoreconf -fi
          ./configure --prefix="$RUNNER_TEMP/difx-install"
          make -j2
          make install
      - name: Verify complex input, scale, phase, and interval selection
        run: DIFX_ZEROCORR="$RUNNER_TEMP/difx-install/bin/zerocorr" python -m pytest -q tests/test_difx_visibility_reference.py
  citation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cffconvert==2.0.0
      - run: cffconvert --validate
