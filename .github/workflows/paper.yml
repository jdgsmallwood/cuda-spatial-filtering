name: Paper
on:
  push:
    paths: ['paper.md', 'paper.bib', '.github/workflows/paper.yml']
  pull_request:
    paths: ['paper.md', 'paper.bib', '.github/workflows/paper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper.pdf
